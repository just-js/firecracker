[package]
name = "joos-fire-patch"
version = "0.1.0"
edition = "2024"

[dependencies]
# No dependencies: hand-rolled, seek-based ELF section-header lookup (see
# section_file_range() in main.rs) - deliberately avoids reading section
# content into this process at all, which the previous `object`-crate-based
# version (reading the whole file into memory first) turned out to do, and
# that reliably corrupted the patched fire2 binary at runtime despite
# producing byte-correct output on disk. See main.rs's top comment.

# Deliberately built via plain `cargo build` (no --release) - Cargo profiles
# can only be set in the workspace root manifest, and per-package overrides
# there can't touch `lto` at all (it's inherently whole-graph). Staying on
# the dev profile sidesteps the workspace's lto=fat/codegen-units=1 release
# settings entirely, which is what actually matters here: this is an
# I/O-bound one-shot tool (read a few MB, write a few MB), not CPU-bound,
# so unoptimized codegen shouldn't matter - and it means rebuilding this
# crate (rarely, only when its own source changes) stays fast.
